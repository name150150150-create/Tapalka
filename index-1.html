<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FactionTap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --bg: #050810;
    --surface: #0d1220;
    --border: #1e2a40;
    --accent: #00f0ff;
    --gold: #ffd700;
    --text: #c8d8f0;
    --muted: #4a5a7a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }

  #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .screen { display: none; position: relative; z-index: 1; min-height: 100vh; padding: 16px; }
  .screen.active { display: flex; flex-direction: column; }

  /* LOADING */
  #loading {
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .spinner {
    width: 50px; height: 50px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* WELCOME */
  #welcome {
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: radial-gradient(ellipse at 50% 30%, #0a1a3a 0%, var(--bg) 70%);
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #00f0ff, #0080ff, #8000ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px #00f0ff80);
    text-align: center;
  }

  .tagline { font-size: 14px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; text-align: center; }

  .factions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 320px;
  }

  .faction-card {
    border-radius: 14px;
    border: 2px solid transparent;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
    background: var(--surface);
  }

  .faction-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.1;
    transition: opacity 0.25s;
  }

  .faction-card.selected { transform: scale(1.05); }
  .faction-card.selected::before { opacity: 0.25; }

  .faction-card .f-icon { font-size: 32px; }
  .faction-card .f-name { font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .faction-card .f-members { font-size: 11px; color: var(--muted); }

  .f-fire  { border-color: #ff4400; }
  .f-fire::before  { background: #ff4400; }
  .f-fire .f-name  { color: #ff6630; }
  .f-ice   { border-color: #00ccff; }
  .f-ice::before   { background: #00ccff; }
  .f-ice .f-name   { color: #44ddff; }
  .f-storm { border-color: #aa00ff; }
  .f-storm::before { background: #aa00ff; }
  .f-storm .f-name { color: #cc44ff; }
  .f-earth { border-color: #44cc00; }
  .f-earth::before { background: #44cc00; }
  .f-earth .f-name { color: #66ee22; }

  .input-group { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 8px; }
  .input-label { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

  input[type=text] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    font-weight: 600;
    padding: 12px 16px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=text]:focus { border-color: var(--accent); }

  .btn {
    background: linear-gradient(135deg, #003888, #0066cc);
    border: 1px solid #0088ff;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 14px 28px;
    text-transform: uppercase;
    transition: all 0.2s;
    box-shadow: 0 4px 20px #0066ff40;
    width: 100%;
    max-width: 320px;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .error-msg { color: #ff4466; font-size: 12px; min-height: 16px; }

  /* GAME */
  #game {
    gap: 0;
    background: radial-gradient(ellipse at 50% -10%, #0a1530 0%, var(--bg) 60%);
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }

  .player-info { display: flex; align-items: center; gap: 10px; }

  .faction-badge {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    border: 2px solid currentColor;
  }

  .player-name { font-size: 15px; font-weight: 700; }
  .player-score-small { font-size: 11px; color: var(--muted); }

  .online-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00ff88;
    margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .tabs {
    display: flex;
    background: var(--surface);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }

  .tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 7px 4px;
    border-radius: 7px;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .tab.active { background: var(--border); color: var(--accent); }

  .tab-content { display: none; flex: 1; flex-direction: column; }
  .tab-content.active { display: flex; }

  /* TAP */
  .tap-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 16px 0;
  }

  .score-display { text-align: center; }

  .score-num {
    font-family: 'Orbitron', monospace;
    font-size: 54px;
    font-weight: 900;
    line-height: 1;
    transition: transform 0.05s;
  }
  .score-num.bump { transform: scale(1.15); }

  .score-label { font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

  .tap-btn {
    width: 170px; height: 170px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    position: relative;
    transition: transform 0.08s;
    outline: none;
  }
  .tap-btn:active { transform: scale(0.91); }
  .tap-btn::before, .tap-btn::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    inset: -6px;
    border: 2px solid currentColor;
    opacity: 0.25;
  }
  .tap-btn::after { inset: -14px; opacity: 0.1; }

  .tap-btn.f-fire  { background: radial-gradient(circle, #5a0000, #2a0000); color: #ff4400; box-shadow: 0 0 40px #ff440040; }
  .tap-btn.f-ice   { background: radial-gradient(circle, #003a5a, #001a2a); color: #00ccff; box-shadow: 0 0 40px #00ccff40; }
  .tap-btn.f-storm { background: radial-gradient(circle, #2a0055, #100022); color: #aa00ff; box-shadow: 0 0 40px #aa00ff40; }
  .tap-btn.f-earth { background: radial-gradient(circle, #0a2a00, #051200); color: #44cc00; box-shadow: 0 0 40px #44cc0040; }

  .faction-label { font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; }
  .tap-hint { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

  .sync-status { font-size: 11px; color: var(--muted); }
  .sync-status.syncing { color: #ffd700; }
  .sync-status.synced  { color: #00ff88; }
  .sync-status.error   { color: #ff4466; }

  /* FLOAT +1 */
  .float-plus {
    position: fixed;
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    pointer-events: none;
    z-index: 999;
    animation: floatUp 0.7s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
  }

  .ripple {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 998;
    animation: rippleAnim 0.5s ease-out forwards;
  }
  @keyframes rippleAnim {
    0%   { transform: scale(0); opacity: 0.5; }
    100% { transform: scale(3); opacity: 0; }
  }

  /* LEADERBOARDS */
  .lb-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    padding-bottom: 16px;
  }

  .lb-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }

  .lb-title {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .lb-refresh {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 3px 8px;
  }
  .lb-refresh:active { color: var(--accent); }

  .lb-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border-radius: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    transition: border-color 0.2s;
  }
  .lb-item.is-me { border-color: var(--accent); background: #00f0ff08; }

  .lb-rank { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; width: 26px; text-align: center; color: var(--muted); }
  .lb-rank.top1 { color: var(--gold); }
  .lb-rank.top2 { color: #c0c0c0; }
  .lb-rank.top3 { color: #cd7f32; }

  .lb-icon { font-size: 20px; }
  .lb-info { flex: 1; min-width: 0; }
  .lb-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-sub  { font-size: 10px; color: var(--muted); }

  .progress-bar-wrap { background: var(--border); border-radius: 4px; height: 3px; width: 100%; margin-top: 3px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

  .lb-score { font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; }

  .lb-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px; }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- LOADING -->
<div id="loading" class="screen active">
  <div class="spinner"></div>
  <div class="loading-text">Завантаження...</div>
</div>

<!-- WELCOME -->
<div id="welcome" class="screen">
  <div class="logo">FACTION<br>TAP</div>
  <div class="tagline">Обери сторону. Тапай за неї.</div>

  <div class="factions-grid" id="factionsGrid"></div>

  <div class="input-group">
    <div class="input-label">Твоє ім'я у грі</div>
    <input type="text" id="nameInput" placeholder="Нікнейм..." maxlength="20"
      oninput="validateForm()" onkeydown="if(event.key==='Enter') tryStart()">
    <div class="error-msg" id="errMsg"></div>
  </div>

  <button class="btn" id="startBtn" onclick="tryStart()" disabled>Почати гру →</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="top-bar">
    <div class="player-info">
      <div class="faction-badge" id="topBadge"></div>
      <div>
        <div class="player-name" id="topName">-</div>
        <div class="player-score-small"><span class="online-dot"></span><span id="topScore">0 тапів</span></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('tap',this)">ТАП</button>
      <button class="tab" onclick="switchTab('players',this)">ГРАВЦІ</button>
      <button class="tab" onclick="switchTab('factions',this)">ФРАКЦІЇ</button>
    </div>
  </div>

  <!-- TAP TAB -->
  <div class="tab-content active" id="tab-tap">
    <div class="tap-area">
      <div class="score-display">
        <div class="score-num" id="myScore">0</div>
        <div class="score-label">Твої тапи</div>
      </div>
      <button class="tap-btn" id="tapBtn" onclick="handleTap(event)"></button>
      <div class="faction-label" id="factionLabel">-</div>
      <div class="sync-status" id="syncStatus">⏳ підключення...</div>
    </div>
  </div>

  <!-- PLAYERS -->
  <div class="tab-content" id="tab-players">
    <div class="lb-section">
      <div class="lb-header">
        <div class="lb-title">🏆 Топ гравців</div>
        <button class="lb-refresh" onclick="loadPlayers()">↻ Оновити</button>
      </div>
      <div id="playersLb"><div class="lb-empty">Завантаження...</div></div>
    </div>
  </div>

  <!-- FACTIONS -->
  <div class="tab-content" id="tab-factions">
    <div class="lb-section">
      <div class="lb-header">
        <div class="lb-title">⚔️ Рейтинг фракцій</div>
        <button class="lb-refresh" onclick="loadFactions()">↻ Оновити</button>
      </div>
      <div id="factionsLb"><div class="lb-empty">Завантаження...</div></div>
    </div>
  </div>
</div>

<script>
// ===== SUPABASE =====
const SUPABASE_URL = 'https://qzvpyomyetgyhcduzuom.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6dnB5b215ZXRneWhjZHV6dW9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMjAzMjMsImV4cCI6MjA5Mjc5NjMyM30.nwGWdc5jNui8_UywZZwt_aRQ8TrfBcOfNU_ih6PKymo';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== FACTIONS =====
const FACTIONS = {
  fire:  { name: 'Вогонь', icon: '🔥', cls: 'f-fire',  color: '#ff4400' },
  ice:   { name: 'Лід',    icon: '❄️', cls: 'f-ice',   color: '#00ccff' },
  storm: { name: 'Буря',   icon: '⚡',  cls: 'f-storm', color: '#aa00ff' },
  earth: { name: 'Земля',  icon: '🌿', cls: 'f-earth', color: '#44cc00' },
};

let player = null;
let selectedFaction = null;
let pendingTaps = 0;
let syncTimer = null;
let factionMembers = { fire: 0, ice: 0, storm: 0, earth: 0 };

// ===== PARTICLES =====
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let pts = [];
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for (let i = 0; i < 55; i++) pts.push({
    x: Math.random()*innerWidth, y: Math.random()*innerHeight,
    vx: (Math.random()-.5)*.3, vy: -Math.random()*.4-.1,
    r: Math.random()*1.5+.5, a: Math.random()
  });
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pts.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(0,160,255,${p.a*.5})`; ctx.fill();
      p.x+=p.vx; p.y+=p.vy; p.a+=(Math.random()-.5)*.02;
      p.a=Math.max(.05,Math.min(1,p.a));
      if(p.y<-5){p.y=canvas.height+5;p.x=Math.random()*canvas.width;}
      if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ===== INIT =====
async function init() {
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  // Check if tables exist, try to setup
  await setupTables();

  // Load faction member counts
  await loadFactionMembers();

  // Check if returning player
  const savedId = localStorage.getItem('factionTapPlayerId');
  if (savedId) {
    const { data } = await sb.from('players').select('*').eq('id', savedId).single();
    if (data) {
      player = data;
      showGame();
      return;
    }
  }

  showWelcome();
}

async function setupTables() {
  // Try to create tables via RPC if they don't exist
  // Tables should be created manually in Supabase — we just test connection here
  try {
    await sb.from('players').select('count').limit(1);
    await sb.from('factions').select('count').limit(1);
  } catch(e) {
    console.log('Tables may not exist yet');
  }
}

async function loadFactionMembers() {
  try {
    const { data } = await sb.from('players').select('faction');
    if (data) {
      factionMembers = { fire: 0, ice: 0, storm: 0, earth: 0 };
      data.forEach(p => { if (factionMembers[p.faction] !== undefined) factionMembers[p.faction]++; });
    }
  } catch(e) {}
}

function showWelcome() {
  document.getElementById('loading').classList.remove('active');
  document.getElementById('welcome').classList.add('active');
  renderFactionCards();
}

function showGame() {
  document.getElementById('loading').classList.remove('active');
  document.getElementById('welcome').classList.remove('active');
  document.getElementById('game').classList.add('active');

  const f = FACTIONS[player.faction];
  const badge = document.getElementById('topBadge');
  badge.textContent = f.icon;
  badge.style.color = f.color;
  document.getElementById('topName').textContent = player.name;

  const btn = document.getElementById('tapBtn');
  btn.textContent = f.icon;
  btn.className = `tap-btn ${f.cls}`;

  const lbl = document.getElementById('factionLabel');
  lbl.textContent = `Фракція: ${f.name}`;
  lbl.style.color = f.color;

  updateScoreDisplay();
  setSyncStatus('synced', '✅ підключено');

  // Subscribe to realtime updates
  subscribeRealtime();
}

// ===== WELCOME =====
function renderFactionCards() {
  const grid = document.getElementById('factionsGrid');
  grid.innerHTML = '';
  Object.entries(FACTIONS).forEach(([key, f]) => {
    const members = factionMembers[key] || 0;
    const el = document.createElement('div');
    el.className = `faction-card ${f.cls}`;
    el.dataset.faction = key;
    el.innerHTML = `
      <div class="f-icon">${f.icon}</div>
      <div class="f-name">${f.name}</div>
      <div class="f-members">${members} гравців</div>`;
    el.onclick = () => selectFaction(el);
    grid.appendChild(el);
  });
}

function selectFaction(el) {
  document.querySelectorAll('.faction-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedFaction = el.dataset.faction;
  validateForm();
}

function validateForm() {
  const name = document.getElementById('nameInput').value.trim();
  const btn  = document.getElementById('startBtn');
  const err  = document.getElementById('errMsg');
  if (!selectedFaction) { err.textContent = 'Обери фракцію'; btn.disabled = true; return; }
  if (name.length < 2)  { err.textContent = name.length ? 'Ім\'я занадто коротке' : ''; btn.disabled = true; return; }
  err.textContent = ''; btn.disabled = false;
}

async function tryStart() {
  const name = document.getElementById('nameInput').value.trim();
  if (!selectedFaction || name.length < 2) return;

  document.getElementById('startBtn').disabled = true;
  document.getElementById('startBtn').textContent = 'Створення...';

  try {
    // Check if name taken
    const { data: existing } = await sb.from('players').select('id').eq('name', name).single();
    if (existing) {
      document.getElementById('errMsg').textContent = 'Це ім\'я вже зайняте!';
      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = 'Почати гру →';
      return;
    }
  } catch(e) {}

  const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  const newPlayer = { id, name, faction: selectedFaction, score: 0 };

  const { error } = await sb.from('players').insert(newPlayer);
  if (error) {
    document.getElementById('errMsg').textContent = 'Помилка підключення. Спробуй ще раз.';
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = 'Почати гру →';
    return;
  }

  player = newPlayer;
  localStorage.setItem('factionTapPlayerId', id);
  showGame();
}

// ===== GAME =====
function handleTap(e) {
  player.score++;
  pendingTaps++;
  updateScoreDisplay();

  // Visual effects
  const plus = document.createElement('div');
  plus.className = 'float-plus';
  plus.textContent = '+1';
  plus.style.left  = (e.clientX - 12) + 'px';
  plus.style.top   = (e.clientY - 20) + 'px';
  plus.style.color = FACTIONS[player.faction].color;
  document.body.appendChild(plus);
  setTimeout(() => plus.remove(), 700);

  const rip = document.createElement('div');
  rip.className = 'ripple';
  const sz = 60;
  rip.style.cssText = `width:${sz}px;height:${sz}px;left:${e.clientX-sz/2}px;top:${e.clientY-sz/2}px;background:${FACTIONS[player.faction].color}70`;
  document.body.appendChild(rip);
  setTimeout(() => rip.remove(), 500);

  // Score bump animation
  const sc = document.getElementById('myScore');
  sc.classList.remove('bump');
  void sc.offsetWidth;
  sc.classList.add('bump');
  setTimeout(() => sc.classList.remove('bump'), 100);

  // Debounced sync — save every 2 seconds
  setSyncStatus('syncing', '⏳ збереження...');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncScore, 2000);
}

async function syncScore() {
  if (!player || pendingTaps === 0) return;
  const tapsToSync = pendingTaps;
  pendingTaps = 0;

  const { error } = await sb.from('players')
    .update({ score: player.score })
    .eq('id', player.id);

  if (error) {
    pendingTaps += tapsToSync; // restore
    setSyncStatus('error', '❌ помилка збереження');
    setTimeout(() => syncScore(), 5000);
  } else {
    setSyncStatus('synced', '✅ збережено');
  }
}

function updateScoreDisplay() {
  const f = FACTIONS[player.faction];
  document.getElementById('myScore').textContent = player.score.toLocaleString();
  document.getElementById('myScore').style.color = f.color;
  document.getElementById('topScore').textContent = player.score.toLocaleString() + ' тапів';
}

function setSyncStatus(cls, text) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status ' + cls;
  el.textContent = text;
}

// ===== REALTIME =====
function subscribeRealtime() {
  sb.channel('players-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, () => {
      // Auto-refresh leaderboard if visible
      const activeTab = document.querySelector('.tab-content.active');
      if (activeTab?.id === 'tab-players') loadPlayers();
      if (activeTab?.id === 'tab-factions') loadFactions();
    })
    .subscribe();
}

// ===== LEADERBOARDS =====
function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'players') loadPlayers();
  if (name === 'factions') loadFactions();
}

async function loadPlayers() {
  document.getElementById('playersLb').innerHTML = '<div class="lb-empty">⏳ Завантаження...</div>';
  const { data, error } = await sb.from('players').select('*').order('score', { ascending: false }).limit(50);
  if (error || !data) {
    document.getElementById('playersLb').innerHTML = '<div class="lb-empty">❌ Помилка завантаження</div>';
    return;
  }
  renderPlayers(data);
}

function renderPlayers(list) {
  const maxScore = list[0]?.score || 1;
  let html = '';
  list.forEach((p, i) => {
    const f = FACTIONS[p.faction] || FACTIONS.fire;
    const isMe = p.id === player?.id;
    const rank = i + 1;
    const rankCls = rank <= 3 ? ['top1','top2','top3'][rank-1] : '';
    const rankEmoji = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
    html += `
      <div class="lb-item ${isMe ? 'is-me' : ''}">
        <div class="lb-rank ${rankCls}">${rankEmoji}</div>
        <div class="lb-icon">${f.icon}</div>
        <div class="lb-info">
          <div class="lb-name">${esc(p.name)}${isMe ? ' 👈' : ''}</div>
          <div class="lb-sub">${f.name}</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar" style="width:${Math.round(p.score/maxScore*100)}%;background:${f.color}"></div>
          </div>
        </div>
        <div class="lb-score">${p.score.toLocaleString()}</div>
      </div>`;
  });
  document.getElementById('playersLb').innerHTML = html || '<div class="lb-empty">Поки немає гравців</div>';
}

async function loadFactions() {
  document.getElementById('factionsLb').innerHTML = '<div class="lb-empty">⏳ Завантаження...</div>';
  const { data, error } = await sb.from('players').select('faction, score');
  if (error || !data) {
    document.getElementById('factionsLb').innerHTML = '<div class="lb-empty">❌ Помилка завантаження</div>';
    return;
  }

  const totals = { fire: 0, ice: 0, storm: 0, earth: 0 };
  const members = { fire: 0, ice: 0, storm: 0, earth: 0 };
  data.forEach(p => {
    if (totals[p.faction] !== undefined) {
      totals[p.faction] += p.score;
      members[p.faction]++;
    }
  });

  const sorted = Object.entries(totals)
    .map(([key, score]) => ({ key, score, members: members[key], ...FACTIONS[key] }))
    .sort((a, b) => b.score - a.score);

  const maxScore = sorted[0]?.score || 1;
  let html = '';
  sorted.forEach((f, i) => {
    const isMyFaction = f.key === player?.faction;
    const rank = i + 1;
    const rankEmoji = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
    html += `
      <div class="lb-item ${isMyFaction ? 'is-me' : ''}">
        <div class="lb-rank">${rankEmoji}</div>
        <div class="lb-icon">${f.icon}</div>
        <div class="lb-info">
          <div class="lb-name">${f.name}${isMyFaction ? ' 👈' : ''}</div>
          <div class="lb-sub">${f.members} гравців</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar" style="width:${Math.round(f.score/maxScore*100)}%;background:${f.color}"></div>
          </div>
        </div>
        <div class="lb-score">${f.score.toLocaleString()}</div>
      </div>`;
  });
  document.getElementById('factionsLb').innerHTML = html;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== START =====
init();
</script>
